name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: |
          cp docs/controls.json /tmp/controls.json
          cp docs/search-controls.json /tmp/search-controls.json
          cp examples/task.json /tmp/task.json
          python tools/build_controls.py
          cmp docs/controls.json /tmp/controls.json
          cmp docs/search-controls.json /tmp/search-controls.json
          cmp examples/task.json /tmp/task.json
      - uses: astral-sh/setup-uv@v5
      - run: bash tools/wheel_smoke.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
